    "ipykernel>=6.29,<7",
    "joblib>=1.3,<2",
    "jupyter>=1.0,<2",
    "kagglehub>=0.3,<1",
    "mat73>=0.65,<1",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
